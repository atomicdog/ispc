name: PowerPC64 Tests

permissions: read-all

on:
  pull_request:
    paths:
      - 'src/**'
      - 'builtins/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ppc64.yml'
  schedule:
    # Nightly run at 07:00 UTC so trunk regressions surface even on
    # days where no PR touches the paths above.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ppc64-native-test:
    name: PowerPC64LE native (${{ matrix.target }} ${{ matrix.opt }})
    runs-on: ubuntu-24.04-ppc64le
    strategy:
      fail-fast: false
      matrix:
        target: [generic-i32x4, vsx-i32x4, vsx-i32x8]
        opt: [O0, O1, O2]

    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl cmake xz-utils m4 flex bison python3 python3-dev libtbb-dev wget lsb-release software-properties-common gnupg
        wget -q https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21
        sudo apt-get install -y llvm-21-dev libclang-21-dev lld-21

    - name: Check tools
      run: |
        cmake --version
        llvm-config-21 --version
        clang-21 --version
        gcc --version
        g++ --version

    - name: Build ISPC with PPC64 support
      run: |
        PATH=/usr/lib/llvm-21/bin:$PATH cmake -B build -DPPC64_ENABLED=ON -DARM_ENABLED=OFF -DX86_ENABLED=OFF
        cmake --build build -j"$(nproc)"

    - name: Run lit tests
      # Lit tests don't depend on the matrix axes (they pick their own
      # targets from RUN: lines), so only run them once per job to keep
      # CI time bounded.
      if: matrix.target == 'vsx-i32x4' && matrix.opt == 'O2'
      run: |
        cmake --build build --target check-all

    - name: Run PPC64LE functional tests
      run: |
        PATH="$PWD"/build/bin:"$PATH" \
        python3 scripts/run_tests.py \
          --target=${{ matrix.target }} \
          --arch=ppc64le \
          --compiler=g++ \
          -o ${{ matrix.opt }}

  ppc64-cross-test:
    name: PowerPC64LE cross (${{ matrix.target }} ${{ matrix.opt }})
    runs-on: ubuntu-24.04
    env:
      LLVM_TAR: llvm-21.1.8-ubuntu22.04-Release+Asserts-x86.arm.ppc.wasm.tar.xz
    strategy:
      fail-fast: false
      matrix:
        target: [generic-i32x4, vsx-i32x4, vsx-i32x8]
        opt: [O0, O1, O2]

    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        submodules: true

    - name: Install dependencies
      run: |
        .github/workflows/scripts/install-build-deps.sh

    - name: Install PPC64 cross-compilation tools
      run: |
        sudo apt-get install -y gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu \
          libc6-dev-ppc64el-cross qemu-user

    - name: Check tools
      run: |
        cmake --version
        llvm-config --version
        clang --version
        powerpc64le-linux-gnu-gcc --version
        qemu-ppc64le --version

    - name: Build ISPC with PPC64 support
      run: |
        cmake -B build -DPPC64_ENABLED=ON -DARM_ENABLED=OFF
        cmake --build build -j"$(nproc)"

    - name: Run lit tests
      # Lit tests don't depend on the matrix axes (they pick their own
      # targets from RUN: lines), so only run them once per job to keep
      # CI time bounded.
      if: matrix.target == 'vsx-i32x4' && matrix.opt == 'O2'
      run: |
        cmake --build build --target check-all

    - name: Run PPC64LE functional tests
      run: |
        PATH="$PWD"/build/bin:"$PATH" \
        python3 scripts/run_tests.py \
          --target=${{ matrix.target }} \
          --arch=ppc64le \
          --wrap-exe="qemu-ppc64le" \
          --compiler=powerpc64le-linux-gnu-g++ \
          -o ${{ matrix.opt }}
